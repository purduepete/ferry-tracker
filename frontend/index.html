<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Explore Washington State Ferries terminal, vessel, and schedule data." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS ignores an SVG favicon when adding to the home screen and needs this PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Ferry Tracker" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const allowed = ['light', 'midnight'];
        let preference = 'midnight';
        try {
          const stored = localStorage.getItem('ferry-tracker-theme');
          if (allowed.includes(stored)) preference = stored;
        } catch {}
        document.documentElement.dataset.theme = preference;
        document.documentElement.style.colorScheme = preference === 'light' ? 'light' : 'dark';
      })();
    </script>
    <title>Ferry Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
