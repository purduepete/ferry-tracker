<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Explore Washington State Ferries terminal, vessel, and schedule data." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const allowed = ['system', 'light', 'dark', 'midnight'];
        let preference = 'midnight';
        try {
          const stored = localStorage.getItem('ferry-tracker-theme');
          if (allowed.includes(stored)) preference = stored;
        } catch {}
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
        const theme = preference === 'system' ? (systemDark ? 'midnight' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
      })();
    </script>
    <title>Ferry Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
